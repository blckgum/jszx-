# 只处理图像平面运动；坐标为 px，速度为 px/s，与道路米制速度无关。
history_length: 60

# 时间自适应 EMA 的时间常数，单位秒。0 关闭对应平滑；越大越平滑、延迟越明显。
position_tau_s: 0.15
velocity_tau_s: 0.30

# 观测间隔超出范围时重新建立速度基准，避免过小分母或长间隔外推。
min_dt_s: 0.001
max_dt_s: 1.0

# 仅用于图像运动状态与方向显示，不代表真实目标静止或道路速度阈值。
stationary_speed_px_s: 2.0

# 同 ID 的原始像素跳变检查；超过时断开运动片段。null 关闭，不能用它识别所有 ID 切换。
max_step_speed_px_s: 2000.0

# 箭头表示速度方向；长度按速度×显示时域计算，再限制为最大像素长度。
arrow_horizon_s: 0.5
arrow_max_length_px: 60
